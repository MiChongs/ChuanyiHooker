# EzHookTool 1.1.3 ships Java 25 bytecode, so both the Kotlin compiler and
# javac have to run on a JDK >= 25. The daemon JVM criteria wins over
# org.gradle.java.home and over the IDE's "Gradle JDK" setting, which is why the
# requirement lives here rather than in gradle.properties.
#
# Android Studio regenerates this file on sync and will happily put its bundled
# JBR (21) back. If the build starts failing with "invalid source release: 25",
# check this value first.
toolchainVersion=26
