org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# The JDK requirement (>= 25, for EzHookTool's Java 25 bytecode) is expressed
# in gradle/gradle-daemon-jvm.properties, which takes precedence over both
# org.gradle.java.home and the IDE's Gradle JDK setting.

kotlin.code.style=official

android.useAndroidX=true
android.nonTransitiveRClass=true
android.newDsl=true

# Built-in Kotlin stays on (the standalone kotlin-android plugin is not
# compatible with AGP 9's new DSL). Its version is raised to 2.4.10 from the
# root build.gradle.kts buildscript classpath.

# libxposed:api:102.0.0 declares minCompileSdk=37.
android.suppressUnsupportedCompileSdk=37

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
