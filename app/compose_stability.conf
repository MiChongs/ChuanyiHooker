// Compose 稳定性配置
//
// 这里列的类型会被编译器当作 stable，从而让持有它们的 composable 恢复可跳过。
// 只有满足下面这条契约的类型才允许写进来：
//
//   同一个实例，其 equals 结果恒定；对 UI 有影响的内部状态要么不可变，
//   要么走 snapshot state（读它的 composable 会被正常 invalidate）。
//
// 判断依据来自编译器报告，不是感觉：
//   .\gradlew.bat :app:assembleRelease -PcomposeReports
//   然后看 app/build/compose_reports/app_release-classes.txt 里的 unstable 判定。
//
// 注释只能用 //，不能用 #：解析器把 # 开头的行当成模式，会以
// "# … is not a valid pattern" 报错。

// 图标加载器。构造后配置不可变，全程只作为参数往下传，本身不参与状态变化。
// 不标的话 AppsScreen / StatusScreen 里每一行 AppRowItem 都不可跳过。
coil3.ImageLoader

// 毛玻璃采样层。内容更新走绘制阶段（GraphicsLayer 重录），不经过重组；
// 对重组来说只有实例身份有意义。不标的话 ProgressiveBlurScrim 与 BlurBar
// 每帧都要重组一遍 —— 而它们里面是三层 RuntimeShader。
top.yukonga.miuix.kmp.blur.Backdrop

// 本项目 :core 的接口。实现全是无状态的 object，属性都是 val，
// :core 没上 Compose 编译器插件所以推断不到。
com.chuanyi.hooker.core.AppHooker
com.chuanyi.hooker.core.HookFeature

// 框架发的进程句柄。字段全是 final，构造后不再变；RunningTarget 持有它是为了
// 回传给 hotReloadModule。不标的话详情页的进程列表每次刷新都整段重组。
io.github.libxposed.service.HookedTarget

// AboutLibraries 的依赖清单实体。构建期生成、进程内解析一次就再也不变的
// data class，字段全是 val。判成 unstable 只是因为 developers / licenses 的
// 静态类型是 List / Set 接口，而那两个集合同样是解析完就冻住的。
// 不标的话开源许可页每一行都不可跳过，搜索框敲一个字就整表重组。
com.mikepenz.aboutlibraries.entity.Library
com.mikepenz.aboutlibraries.entity.License
